server {
    listen 80;
    server_name _;

    # Increase client body size if large uploads are expected
    client_max_body_size 50M;

    # Redirect bare /motor to /motor/ (so relative links work)
    location = /motor {
        return 301 /motor/;
    }

    # Proxy all /motor/* requests to the Python app, removing the /motor prefix
    # e.g. /motor/foo -> http://web:5000/foo
    location /motor/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90;
        proxy_pass http://web:5000/;
    }

    # Optional: serve static files directly from nginx if you copy them into an image
    # location /static/ {
    #     alias /usr/share/nginx/html/static/;
    # }
}
